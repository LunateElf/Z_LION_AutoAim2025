/hik_camera:
  ros__parameters:
    camera_name: hik_camera
    exposure_time: 6000
    gain: 32.0
    image_rotation: 180

/mv_camera:
  ros__parameters:
    camera_name: mv_camera
    exposure_time: 3000
    analog_gain: 24
    image_rotation: 0

/auto_aim_detector_node:
  ros__parameters:
    debug: true
    use_fusion_detector: true
    set_enemy_color: 2
    show_time_cost: true

    Machine:
      pic_min_threshold: 0.0

    ArmorFinder:
      armor_min_height_ratio: 0.2
      small_armor_min_aspect_ratio: 0.8
      small_armor_max_aspect_ratio: 3.2
      big_armor_min_aspect_ratio: 3.2
      big_armor_max_aspect_ratio: 8.0
      max_center_angle: 25.0

    YoloModel:
      yolo_model_path: "/home/meta/vision_ws/src/auto_aim/models/yolo.onnx"

    NumberFinder:
      number_model_path: "/home/meta/vision_ws/src/auto_aim/models/mlp.onnx"

/auto_aim_processor_node:
  ros__parameters:
    debug: true
    Coordinate:
      intrinsic:  [1268.90539,    0.     ,  675.45367,
                      0.     , 1273.26422,  582.41381,
                      0.     ,    0.     ,    1.     ]
      distcoeffs: [-0.101470, 0.165034, 0.014105, 0.005597, 0.000000]
      shaft_differ_x: 0.0
      shaft_differ_y: -4.59
      shaft_differ_z: 12.282
      sot_shaft_differ_x: 0.0
      sot_shaft_differ_y: -4.66
      sot_shaft_differ_z: 12.371
      sot_shifting_yaw: 1.8
      sot_shifting_pitch: -8.0

    DiagonalAngleSolver:
      inclined: 0.392
      pixel_error: 1.8
      increase_param_blue: 1.2
      increase_param_red: 1.2

    TargetPlanner:
      buffer_size: 30

    CarState:
      q_vs: [0.01, 0.01, 0.01, 0.02, 0.04, 0.04, 0.001, 0.1]
      r_vs: [0.1, 0.13, 1.3, 0.2]
      use_middle_car_state: false

    TranslationState:
      trans_q_vs: [0.03, 0.03,0.01,0.2, 0.2]
      trans_r_vs: [0.1, 0.13, 1.3]

    Processor:
      vxz_truncation_rotate_rpm: 80.0
      max_detect_distance: 400.0

    bullet_speed: 2330.0

    PitchCompensator:
      pitch_compensation_amplitude: 1.0

    RangeSetter:
      max_shoot_x: 6.75
      max_shoot_y: 7.5
      max_shoot_middle_x: 0.5
      max_send_yaw: 16.0
      max_send_pitch: 4.0
      max_send_yaw_speed: 10000.0
      trans_control_compensation_left: 0.07
      trans_control_compensation_right: 0.07
      rotate_control_compensation_left: 0.08
      rotate_control_compensation_right: 0.08

    TimePredictor:
      shoot_delay: 0.0155
      serial_delay: 0.005

    ShootTrackStrategy:
      switch_reverse_amplification_weight: 0.6

    HeroShootStrategy:
      min_shoot_interval: 0.40

    StrategyPlanner:
      min_shoot_track_rpm: 7.0
      min_shoot_middle_rpm: 60.0
      min_shoot_precise_rpm: 90.0
      min_shoot_track_distance: 100.0
      max_shoot_track_distance: 320.0

    Controler:
      shoot_state: 0
      delay_shooting_param: 0.5

/serial_send_data_node:
  ros__parameters:
    debug: true
    close_shoot: false
    negation_send_yaw: true
    negation_send_pitch: true

/serial_read_data_node:
  ros__parameters:
    debug: true
    negation_read_yaw: true
    negation_read_pitch: true

/auto_aim_debug_node:
  ros__parameters:
    show: true
    show_detect: true
    show_process: false
    show_time_cost: false
    open_origin_image_loader: false
    open_show_image_loader: false
    load_video_root_path: "src/auto_aim_debug/debug_videos"
    recording_time: -1.0
    avi: false
    image_width: 1440
    image_height: 1080
